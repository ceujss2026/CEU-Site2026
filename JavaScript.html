<script>
  /**
   * 1. OTP LOGIN CONTROLLER
   * Step 1: user enters school email -> backend emails a 6-digit code.
   * Step 2: user enters the code -> backend returns a session token.
   */
  let sessionToken = null;
  let currentUserRole = null;
  let sessionTimeoutId = null; // Tracks the auto-logout timer
  const SESSION_LENGTH_MS = 60 * 60 * 1000; // 1 hour, matches backend session length
  let otpStep = 'email';

  function setLoginMsg_(text, ok) {
    var el = document.getElementById('login-error');
    if (!el) return;
    el.innerText = text;
    el.style.color = ok ? '#ffffff' : '#ffd9c4';
  }

  function handleLoginSubmit() {
    if (otpStep === 'email') sendOtp(); else verifyOtp();
  }

  function sendOtp() {
    var emailEl = document.getElementById('username');
    var email = emailEl.value.trim().toLowerCase();
    var btn = document.getElementById('login-btn');
    if (!email) { setLoginMsg_('Please enter your school email.', false); return; }

    btn.disabled = true;
    setLoginMsg_('Sending code...', true);

    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        if (!res.success) { setLoginMsg_(res.message, false); return; }

        // Remember email (optional)
        try {
          if (document.getElementById('remember-email').checked) localStorage.setItem('ceu_email', email);
          else localStorage.removeItem('ceu_email');
        } catch (e) { /* storage may be blocked in the iframe */ }

        otpStep = 'code';
        emailEl.readOnly = true;
        document.getElementById('otp-code').style.display = 'block';
        document.getElementById('otp-code').focus();
        document.getElementById('otp-hint').style.display = 'block';
        document.getElementById('remember-row').style.display = 'none';
        document.getElementById('otp-back').style.display = 'inline';
        document.getElementById('otp-resend').style.display = 'inline';
        btn.innerText = 'Verify & Sign In';
        setLoginMsg_(res.message, true);
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        setLoginMsg_('Network/System Error: ' + err.message, false);
      })
      .requestLoginOtp(email);
  }

  function verifyOtp() {
    var email = document.getElementById('username').value.trim().toLowerCase();
    var code = document.getElementById('otp-code').value.trim();
    var btn = document.getElementById('login-btn');
    if (code.length !== 6) { setLoginMsg_('Please enter the 6-digit code.', false); return; }

    btn.disabled = true;
    setLoginMsg_('Verifying...', true);

    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        if (!res.success) { setLoginMsg_(res.message, false); return; }
        setLoginMsg_('', true);
        sessionToken = res.token;
        currentUserRole = res.role;
        resetOtpStep();
        startPortalAuth();
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        setLoginMsg_('Network/System Error: ' + err.message, false);
      })
      .verifyLoginOtp(email, code);
  }

  function resetOtpStep() {
    otpStep = 'email';
    var emailEl = document.getElementById('username');
    if (emailEl) emailEl.readOnly = false;
    var ids = { 'otp-code': 'none', 'otp-hint': 'none', 'otp-back': 'none', 'otp-resend': 'none' };
    Object.keys(ids).forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.style.display = ids[id];
    });
    var code = document.getElementById('otp-code');
    if (code) code.value = '';
    var rem = document.getElementById('remember-row');
    if (rem) rem.style.display = 'flex';
    var btn = document.getElementById('login-btn');
    if (btn) { btn.innerText = 'Send Verification Code'; btn.disabled = false; }
  }

  // Pre-fill remembered email on page load
  document.addEventListener('DOMContentLoaded', function() {
    try {
      var saved = localStorage.getItem('ceu_email');
      if (saved) {
        document.getElementById('username').value = saved;
        document.getElementById('remember-email').checked = true;
      }
    } catch (e) { /* ignore */ }
  });

  /**
   * ROLE HELPERS
   * Must match DASHBOARD_ROLES_ / USER_MANAGER_ROLES_ in Code.gs. (The server is the real
   * gatekeeper; these only decide what to show in the browser.)
   */
  function roleLower_() {
    return (currentUserRole || '').toString().trim().toLowerCase();
  }
  function isAdminRole() { return roleLower_() === 'admin'; }
  function isOfficerRole() { return roleLower_() === 'officer'; }
  function canSeeDashboard() { return isOfficerRole() || isAdminRole(); }
  function canManageUsers() { return isOfficerRole() || isAdminRole(); }

  /**
   * 2. PORTAL GATES
   */
  function startPortalAuth() {
    document.getElementById('login-container').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';

    var dashPill = document.getElementById('admin-dashboard-nav-pill');
    if (dashPill) dashPill.style.display = canSeeDashboard() ? 'inline-flex' : 'none';
    var usersPill = document.getElementById('admin-users-nav-pill');
    if (usersPill) usersPill.style.display = canManageUsers() ? 'inline-flex' : 'none';

    showPage('home');

    // Auto-logout once the session expires, so users aren't left on a dead session
    if (sessionTimeoutId) clearTimeout(sessionTimeoutId);
    sessionTimeoutId = setTimeout(function() {
      alert("Your session has expired after 1 hour. Please log in again.");
      handleLogout();
    }, SESSION_LENGTH_MS);

    // Bump the site-wide visit counter shown in the footer
    google.script.run
      .withSuccessHandler(function(count) {
        const counterElem = document.getElementById('footer-visit-count');
        if (counterElem) counterElem.innerText = count;
      })
      .withFailureHandler(function(err) {
        const counterElem = document.getElementById('footer-visit-count');
        if (counterElem) counterElem.innerText = '—';
      })
      .incrementSiteVisitCount();
  }

  function handleLogout() {
    sessionToken = null;
    currentUserRole = null;
    if (sessionTimeoutId) {
      clearTimeout(sessionTimeoutId);
      sessionTimeoutId = null;
    }
    document.getElementById('main-app').style.display = 'none';
    document.getElementById('login-container').style.display = 'flex';

    // Reset the OTP form so the next user starts fresh
    resetOtpStep();
    document.getElementById('login-error').innerText = '';
    try {
      if (!localStorage.getItem('ceu_email')) document.getElementById('username').value = '';
    } catch (e) {
      document.getElementById('username').value = '';
    }
  }

  /**
   * 3. PAGE ROUTER / NAVIGATOR
   */
  function requestSlideFullscreen(btn) {
    const wrapper = btn.closest('.slides-wrapper');
    if (!wrapper) return;

    // Fullscreen the WRAPPER, not the iframe, so the top-bar shield stays layered on top.
    if (wrapper.requestFullscreen) wrapper.requestFullscreen();
    else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
    else if (wrapper.mozRequestFullScreen) wrapper.mozRequestFullScreen();
    else if (wrapper.msRequestFullscreen) wrapper.msRequestFullscreen();
  }

  function showPage(pageId) {
    // Browser-side guard (the server checks again on every request)
    if (pageId === 'dashboard' && !canSeeDashboard()) return;
    if (pageId === 'users' && !canManageUsers()) return;

    const modules = document.querySelectorAll('.page-content');
    modules.forEach(m => m.classList.remove('active'));

    let targetModule = document.getElementById('page-' + pageId);
    if (!targetModule) {
      targetModule = document.getElementById('page-page-' + pageId);
    }

    if (targetModule) {
      targetModule.classList.add('active');

      // ON-DEMAND LOAD: load iframes only when their page is opened
      const pendingIframes = targetModule.querySelectorAll('iframe[data-src]');
      pendingIframes.forEach(iframe => {
        if (!iframe.src || iframe.src === 'about:blank') {
          const realSrc = iframe.getAttribute('data-src');
          if (realSrc) {
            iframe.src = realSrc;
          }
        }
      });
    }

    const navLinks = document.querySelectorAll('.nav-link');
    navLinks.forEach(link => link.classList.remove('active'));

    if (pageId === 'home') {
      const homeLink = document.getElementById('link-home');
      if (homeLink) homeLink.classList.add('active');
    } else if (pageId === 'admission') {
      const admissionLink = document.getElementById('link-admission');
      if (admissionLink) {
        const activeElem = admissionLink.tagName === 'A' ? admissionLink : admissionLink.querySelector('a');
        if (activeElem) activeElem.classList.add('active');
      }
    }

    document.querySelectorAll('[data-hub-page]').forEach(function(el) { el.classList.remove('active'); });
    document.querySelectorAll('[data-hub-page="' + pageId + '"]').forEach(function(el) { el.classList.add('active'); });

    const heroBanner = document.getElementById('portal-hero-banner');
    if (heroBanner) heroBanner.classList.toggle('hero-compact', pageId !== 'home');
    document.querySelector('main').classList.toggle('home-tight', pageId === 'home');

    window.scrollTo({ top: 0, behavior: 'smooth' });

    // Analytics logging (not for home / admin pages)
    if (sessionToken && pageId !== 'home' && pageId !== 'dashboard' && pageId !== 'users') {
      google.script.run
        .withFailureHandler(function(err) { /* logging is best-effort */ })
        .logPageView(sessionToken, pageId);
    }

    if (pageId === 'dashboard') loadOfficerDashboard();
    if (pageId === 'users') loadAdminPage();

    // Aptitude tests trigger
    if ((pageId === 'aptitude-tests' || pageId === 'page-aptitude-tests') && typeof window.renderAptitudeTests === 'function') {
      window.renderAptitudeTests();
    }
  }

  /**
   * 4. AUTOMATED LIVE SYNC TIMESTAMP
   */
  document.addEventListener("DOMContentLoaded", function() {
    google.script.run
      .withSuccessHandler(function(dateString) {
        const updateText = document.getElementById("system-update-date");
        if (updateText) {
          updateText.innerText = "Last updated: " + dateString;
        }
      })
      .withFailureHandler(function(err) {
        const updateText = document.getElementById("system-update-date");
        if (updateText) {
          updateText.innerText = "Sync Error: " + err.message;
        }
      })
      .getScriptEditTime();
  });

  /**
   * 5. LOADING OVERLAY
   */
  function hidePageLoadingOverlay() {
    const overlay = document.getElementById('page-loading-overlay');
    if (overlay) overlay.style.display = 'none';
  }
  document.addEventListener('DOMContentLoaded', hidePageLoadingOverlay);
  setTimeout(hidePageLoadingOverlay, 4000); // failsafe

  /**
   * 6. HOMEPAGE SCROLL-REVEAL
   */
  document.addEventListener('DOMContentLoaded', function() {
    const homeStrips = document.querySelectorAll('#page-home .home-section-strip');
    if (!homeStrips.length) return;

    homeStrips.forEach(function(strip) { strip.classList.add('reveal-on-scroll'); });

    if (!('IntersectionObserver' in window)) {
      homeStrips.forEach(function(strip) { strip.classList.add('revealed'); });
      return;
    }

    const observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('revealed');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });

    homeStrips.forEach(function(strip) { observer.observe(strip); });
  });

  /**
   * 7. SLIDE VIEWER HEADERS
   */
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.slides-wrapper').forEach(function(w) {
      if (w.parentElement.classList.contains('pdf-section')) return;
      var sec = document.createElement('div');
      sec.className = 'pdf-section';
      var head = document.createElement('div');
      head.className = 'pdf-header';
      head.innerHTML = '<h2>' + (w.getAttribute('data-title') || 'Overview') +
                       '</h2><span class="hint">View slides below · Viewing only</span>';
      w.parentNode.insertBefore(sec, w);
      sec.appendChild(head);
      sec.appendChild(w);
    });
  });

  /**
   * 8. SHARED HELPERS + PAGE LABELS (used by search and the dashboard)
   */
  function escapeHtml_(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var PAGE_LABELS = {
    'home': 'Home Page',
    'admission': 'Application Portals & Aptitude Tests',
    'resources': 'Career Resources',
    'dashboard': 'Dashboard',
    'users': 'User Management',

    'hub-institutions': 'Education Pathways — Main Page',
    'hub-scholarships': 'Scholarships — Main Page',
    'hub-uniformed': 'Uniformed Groups — Main Page',
    'hub-gov': 'Government Sector — Main Page',
    'hub-corporate': 'Private Sectors — Main Page',

    'page-pathway': 'BTEC Pathway',
    'inst-filter': 'Technical Institutions Filtering',
    'inst-sixth-form': 'Sixth Form Centres',
    'inst-universities': 'Local Universities',
    'inst-technical': 'Technical, Vocational & Skills Training Institutes',
    'inst-private': 'Private Institutions',
    'inst-training': 'Education Provider',

    'ubd-detail': 'Universiti Brunei Darussalam',
    'utb-detail': 'Universiti Teknologi Brunei',
    'unissa-detail': 'Universiti Islam Sultan Sharif Ali',
    'kupusb-detail': 'Kolej Universiti Perguruan Ugama Seri Begawan',

    'ibte-detail': 'Institut Pendidikan Teknikal Brunei (IBTE)',
    'pb-detail': 'Politeknik Brunei (PB)',
    'ppb-detail': 'Pusat Pembangunan Belia (PPB)',
    'kesenian-detail': 'Pusat Latihan Kesenian & Pertukangan Tangan Brunei',
    'l3c-detail': 'Pusat Pembelajaran Sepanjang Hayat (L3C)',

    'lcb-detail': 'Laksamana College of Business',
    'kigs-detail': 'Kolej International Graduate Studies',
    'ccct-detail': 'Cosmopolitan College of Commerce and Technology',
    'jpmc-detail': 'JPMC College of Health Sciences',
    'micronet-detail': 'Micronet International College',
    'kemuda-detail': 'Kemuda Institute',
    'hadtech-detail': 'HADtech College',
    'bicpa-detail': 'BICPA Academy',
    'uniklearn-detail': 'Uniklearn (An-Nur Harapan)',

    'findlay-detail': 'Findlay Education Services',
    'hrds-detail': 'HRD Services (HRDS)',

    'sub-menu-gov': 'Government Scholarship',
    'sub-menu-foreign': 'Scholarships Abroad',
    'moe-gov-detail': 'Ministry of Education Scholarship',
    'sultan-gov-detail': "Sultan's Scholar Scheme",
    'mindef-gov-detail': 'Supreme Commander MINDEF Scholarship',
    'bdgs-gov-detail': 'Brunei Darussalam Government Scholarship (BDGS)',
    'india-foreign-detail': 'High Commission of India',
    'japan-foreign-detail': 'Embassy of Japan',
    'korea-foreign-detail': 'Embassy of the Republic of Korea',
    'usa-foreign-detail': 'U.S. Embassy',
    'turkiye-foreign-detail': 'Embassy of the Republic of Turkiye',

    'page-rbaf': 'Royal Brunei Armed Forces',
    'page-rbpf': 'Royal Brunei Police Force',
    'page-bomba': 'Fire and Rescue Department',
    'page-penjara': 'Prisons Department',

    'page-moh': 'Ministry of Health',
    'page-met': 'Meteorological Department',
    'page-rtb': 'Radio Televisyen Brunei',
    'page-tourism': 'Tourism Development Department',
    'page-rba': 'Royal Brunei Airlines',
    'page-bdnac': 'Brunei Darussalam National Accreditation Council, MOE',
    'page-hed': 'Department of Higher Education, MOE',
    'page-jpp': 'Department of Educators Management, MOE',

    'page-corp-dst': 'Datastream Digital (DST)',
    'page-corp-hibiscus': 'Hibiscus EP (Brunei) B.V.',
    'page-corp-aegis': 'AEGIS Secure Solutions'
  };

  function pageLabel_(pageId) {
    return PAGE_LABELS[pageId] || pageId;
  }

  /* ============================================================
     9. DASHBOARD + USER MANAGEMENT
     ============================================================ */
  var dxCharts = {}, dxSchools = [], dxDormant = [], dxUsers = [], dxUsersView = [], dxRequests = [];
  var dxEditing = null;   // username being edited, or null when adding

  /* ---------- generic helpers ---------- */
  function dxTab(group, paneId, btn) {
    document.querySelectorAll('.dx-tab[data-g="' + group + '"]').forEach(function (t) { t.classList.remove('active'); });
    document.querySelectorAll('.dx-pane[data-g="' + group + '"]').forEach(function (p) { p.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    var pane = document.getElementById(paneId);
    if (pane) pane.classList.add('active');
    Object.keys(dxCharts).forEach(function (k) { try { dxCharts[k].resize(); } catch (e) {} });
  }

  function dxChart_(id, cfg) {
    var c = document.getElementById(id);
    if (!c || typeof Chart === 'undefined') return;
    if (dxCharts[id]) dxCharts[id].destroy();
    dxCharts[id] = new Chart(c.getContext('2d'), cfg);
  }

  function dxBar_(id, labels, data) {
    dxChart_(id, {
      type: 'bar',
      data: { labels: labels, datasets: [{ data: data, backgroundColor: '#0ABAB5', borderRadius: 4, maxBarThickness: 24 }] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { beginAtZero: true, ticks: { precision: 0, color: '#3F6E68' }, grid: { color: '#CDE8E5' } },
                  y: { ticks: { color: '#0d3a37', font: { size: 11 } }, grid: { display: false } } }
      }
    });
  }

  function dxCsv_(filename, header, rows) {
    var lines = [header.join(',')];
    rows.forEach(function (r) {
      lines.push(r.map(function (v) {
        var s = String(v == null ? '' : v).replace(/"/g, '""');
        return /[",\n]/.test(s) ? '"' + s + '"' : s;
      }).join(','));
    });
    var blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function dxSet_(id, val) { var el = document.getElementById(id); if (el) el.innerText = val; }
  function dxMsg_(id, text, ok) {
    var el = document.getElementById(id);
    if (!el) return;
    el.className = 'dx-msg ' + (text ? (ok ? 'ok' : 'err') : '');
    el.innerText = text || '';
  }
  function dxStatusBadge_(s) {
    var cls = s === 'Active' ? 'dx-b-ok' : (s === 'Low Activity' ? 'dx-b-warn' : 'dx-b-none');
    return '<span class="dx-badge ' + cls + '">' + escapeHtml_(s) + '</span>';
  }

  /* ---------- dashboard ---------- */
  function loadOfficerDashboard(force) {
    if (!sessionToken || !canSeeDashboard()) return;
    dxSet_('dx-updated', 'Loading…');

    google.script.run
      .withSuccessHandler(renderOfficerDashboard)
      .withFailureHandler(function (err) { dxSet_('dx-updated', 'Could not load: ' + err.message); })
      .getDashboardStats(sessionToken, !!force);

    google.script.run
      .withSuccessHandler(renderPageViews)
      .withFailureHandler(function () { dxSet_('dx-views-note', 'Could not load page views.'); })
      .getPageViewStats(sessionToken);
  }

  function renderOfficerDashboard(s) {
    dxSet_('dx-updated', 'Data as of ' + s.generatedAt + ' · Site updated ' + s.lastUpdated);
    dxSet_('dx-k-users', s.totalUsers);
    dxSet_('dx-k-a7', s.active7);
    dxSet_('dx-k-a30', s.active30);
    dxSet_('dx-k-never', s.neverLoggedIn);
    dxSet_('dx-k-schools', s.participatingSchools);
    dxSet_('dx-k-outreach', s.needsOutreachCount);
    dxSet_('dx-k-visits', s.totalVisits);
    dxSet_('dx-l-today', s.loginsToday);
    dxSet_('dx-l-week', s.loginsThisWeek);
    dxSet_('dx-l-month', s.loginsThisMonth);

    dxChart_('dx-c-trend', {
      type: 'line',
      data: {
        labels: s.loginTrend.map(function (p) { var d = new Date(p.date + 'T00:00:00'); return (d.getMonth() + 1) + '/' + d.getDate(); }),
        datasets: [{ data: s.loginTrend.map(function (p) { return p.count; }), borderColor: '#078C86', backgroundColor: 'rgba(10,186,181,.18)', fill: true, tension: .35, pointRadius: 2, borderWidth: 2 }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { x: { ticks: { color: '#3F6E68', font: { size: 10 } }, grid: { color: '#E9FBF8' } },
                  y: { beginAtZero: true, ticks: { precision: 0, color: '#3F6E68', font: { size: 10 } }, grid: { color: '#E9FBF8' } } } }
    });

    var top = s.schoolActivity.filter(function (x) { return x.logins > 0; }).slice(0, 6);
    dxBar_('dx-c-schools', top.map(function (x) { return x.school; }), top.map(function (x) { return x.logins; }));

    var roles = Object.keys(s.roleBreakdown);
    dxChart_('dx-c-roles', {
      type: 'doughnut',
      data: { labels: roles, datasets: [{ data: roles.map(function (k) { return s.roleBreakdown[k]; }), backgroundColor: ['#0d3a37', '#0ABAB5', '#3F6E68', '#078C86', '#9fd9d4', '#14ADA0'], borderWidth: 0 }] },
      options: { responsive: true, maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'right', labels: { color: '#0d3a37', font: { size: 11 } } } } }
    });

    dxSchools = s.schoolActivity || [];
    renderSchoolsTable();

    dxDormant = s.dormantList || [];
    renderDormantTable();
    var badge = document.getElementById('dx-followup-count');
    if (badge) { badge.innerText = dxDormant.length; badge.style.display = dxDormant.length ? 'inline-block' : 'none'; }
  }

  function renderSchoolsTable() {
    var box = document.getElementById('dx-schools-table');
    if (!box) return;
    var q = (document.getElementById('dx-school-q').value || '').trim().toLowerCase();
    var st = document.getElementById('dx-school-status').value;
    var rows = dxSchools.filter(function (s) {
      return (!q || s.school.toLowerCase().indexOf(q) !== -1) && (st === 'all' || s.status === st);
    });
    if (!rows.length) { box.innerHTML = '<div class="dx-empty">No schools match.</div>'; return; }

    var max = 1; rows.forEach(function (s) { if (s.logins > max) max = s.logins; });
    box.innerHTML = '<table class="dx-table"><thead><tr><th>School</th><th>Users</th><th>Logins (30d)</th><th>Last active</th><th>Status</th></tr></thead><tbody>' +
      rows.map(function (s) {
        var pct = Math.max(Math.round(s.logins / max * 100), s.logins ? 6 : 0);
        return '<tr><td><b>' + escapeHtml_(s.school) + '</b></td><td>' + s.teacherCount + '</td>' +
          '<td><div class="dx-bar"><i><u style="width:' + pct + '%"></u></i>' + s.logins + '</div></td>' +
          '<td>' + escapeHtml_(s.lastActive) + '</td><td>' + dxStatusBadge_(s.status) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  function exportSchoolsCsv() {
    dxCsv_('school-activity.csv', ['School', 'Users', 'Logins (30d)', 'Last active', 'Status'],
      dxSchools.map(function (s) { return [s.school, s.teacherCount, s.logins, s.lastActive, s.status]; }));
  }

  /* ---------- top content: main pages vs individual pages ---------- */
  var MAIN_PAGE_IDS = ['admission', 'resources', 'inst-filter', 'inst-sixth-form',
                       'inst-universities', 'inst-technical', 'inst-private', 'inst-training'];

  function isMainPage_(id) {
    return /^hub-/.test(id) || /^sub-menu-/.test(id) || MAIN_PAGE_IDS.indexOf(id) !== -1;
  }

  function dxViewsTable_(boxId, items, emptyMsg) {
    var box = document.getElementById(boxId);
    if (!box) return;
    if (!items.length) { box.innerHTML = '<div class="dx-empty">' + emptyMsg + '</div>'; return; }
    var max = items[0].count || 1;
    box.innerHTML = '<table class="dx-table"><thead><tr><th>#</th><th>Page</th><th>Trend</th><th>Views</th></tr></thead><tbody>' +
      items.slice(0, 15).map(function (it, i) {
        return '<tr><td><span class="dx-rank">' + (i + 1) + '</span></td><td><b>' + escapeHtml_(it.label) + '</b></td>' +

  var siteSearchIndex = null;

  function buildSiteSearchIndex() {
    var items = [];
    document.querySelectorAll('.page-content .profile-matrix-item, .page-content .admission-card').forEach(function(card) {
      var titleEl = card.querySelector('.matrix-item-bold-title, h3, .admission-col-right h3');
      if (!titleEl) return;
      var title = titleEl.textContent.trim();
      if (!title) return;

      var pageAncestor = card.closest('.page-content');
      if (!pageAncestor) return;
      var listingPageId = pageAncestor.id.replace(/^page-/, '');

      var directTarget = null;
      var onclickAttr = card.getAttribute('onclick') || '';
      var m = onclickAttr.match(/showPage\('([^']+)'\)/);
      if (m) directTarget = m[1];

      var logoEl = card.querySelector('.matrix-item-logo, .logo-box img');
      var logoSrc = logoEl ? logoEl.src : null;

      items.push({
        title: title,
        listingPageId: listingPageId,
        directTarget: directTarget,
        logo: logoSrc,
        cardEl: card
      });
    });
    return items;
  }

  function openSiteSearch() {
    if (!siteSearchIndex) siteSearchIndex = buildSiteSearchIndex();
    var overlay = document.getElementById('site-search-overlay');
    overlay.classList.add('open');
    var input = document.getElementById('site-search-input');
    input.value = '';
    runSiteSearch('');
    setTimeout(function() { input.focus(); }, 50);
    document.addEventListener('keydown', siteSearchKeydownHandler);
  }

  function closeSiteSearch() {
    document.getElementById('site-search-overlay').classList.remove('open');
    document.removeEventListener('keydown', siteSearchKeydownHandler);
  }

  function siteSearchKeydownHandler(e) {
    if (e.key === 'Escape') closeSiteSearch();
  }

  function highlightMatch_(text, query) {
    if (!query) return escapeHtml_(text);
    var idx = text.toLowerCase().indexOf(query.toLowerCase());
    if (idx === -1) return escapeHtml_(text);
    return escapeHtml_(text.slice(0, idx)) + '<mark>' + escapeHtml_(text.slice(idx, idx + query.length)) + '</mark>' + escapeHtml_(text.slice(idx + query.length));
  }

  function runSiteSearch(query) {
    var resultsEl = document.getElementById('site-search-results');
    query = (query || '').trim();

    if (!query) {
      resultsEl.innerHTML = '<div class="site-search-hint">Start typing to search across the whole portal.</div>';
      return;
    }

    var matches = siteSearchIndex.filter(function(item) {
      return item.title.toLowerCase().indexOf(query.toLowerCase()) !== -1;
    }).slice(0, 30);

    if (!matches.length) {
      resultsEl.innerHTML = '<div class="site-search-empty">No matches for "' + escapeHtml_(query) + '".</div>';
      return;
    }

    resultsEl.innerHTML = matches.map(function(item, idx) {
      var sectionLabel = pageLabel_(item.directTarget || item.listingPageId);
      var logoHtml = item.logo ? '<img class="site-search-result-logo" src="' + item.logo + '" alt="">' : '';
      return '<div class="site-search-result-item" data-idx="' + idx + '" onclick="goToSiteSearchResult(' + idx + ')">' +
        logoHtml +
        '<div class="site-search-result-text">' +
          '<div class="site-search-result-title">' + highlightMatch_(item.title, query) + '</div>' +
          '<div class="site-search-result-section">' + escapeHtml_(sectionLabel) + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    resultsEl._matches = matches;
  }

  function goToSiteSearchResult(idx) {
    var resultsEl = document.getElementById('site-search-results');
    var item = resultsEl._matches[idx];
    if (!item) return;

    closeSiteSearch();

    var targetPage = item.directTarget || item.listingPageId;
    showPage(targetPage);

    if (!item.directTarget) {
      setTimeout(function() {
        item.cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        item.cardEl.style.transition = 'box-shadow 0.3s';
        item.cardEl.style.boxShadow = '0 0 0 3px var(--ceu-gold)';
        setTimeout(function() { item.cardEl.style.boxShadow = ''; }, 1800);
      }, 150);
    }
  }

  // Keyboard shortcut: Ctrl/Cmd+K opens search from anywhere in the portal
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      if (document.getElementById('main-app').style.display !== 'none') {

  });

  function pageEl(key) {

    /* 1. detail pages: replace the https://... placeholder */
    Object.keys(SITES).forEach(function (key) {
      var page = pageEl(key);
      var btn = page && page.querySelector('.profile-hero-btn');
      if (btn && btn.getAttribute('href') === 'https://...') btn.setAttribute('href', SITES[key]);
    });

    /* 2. hide any placeholder button that is still unfilled, so nobody clicks a dead link */
    document.querySelectorAll('.profile-hero-btn[href="https://..."]').forEach(function (b) {
      b.style.display = 'none';
    });

    /* 3. listing cards: add a Website pill where one is missing */
    document.querySelectorAll('.profile-matrix-item').forEach(function (card) {
      var m = (card.getAttribute('onclick') || '').match(/showPage\('([^']+)'\)/);
